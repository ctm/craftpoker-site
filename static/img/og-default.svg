<!--
  Default social-share image (Open Graph / Twitter card), 1200x630.
  TODO(ctm): most social scrapers (Facebook, Slack, LinkedIn) do NOT render
  SVG og:images — export/replace this with a 1200x630 PNG named og-default.png
  before launch and update the fallback path in templates/partials/head_meta.html.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Craft Poker — home poker with friends">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155842"/>
      <stop offset="1" stop-color="#0c3928"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.28" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3fa87d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3fa87d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- chip mark -->
  <g transform="translate(120 130)">
    <circle cx="44" cy="44" r="44" fill="#1a6b4f"/>
    <circle cx="44" cy="44" r="33" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="9 9" opacity="0.75"/>
    <path fill="#ffffff" transform="translate(44 44) scale(1.5)" d="M0 -14c-6 7 -15 12 -15 20 0 4.5 3.6 7.6 8 7.6 2.3 0 4.2-.9 5.5-2.5-.4 3.6-1.6 5.9-4 7.9h11c-2.4-2-3.6-4.3-4-7.9 1.3 1.6 3.2 2.5 5.5 2.5 4.4 0 8-3.1 8-7.6 0-8-9-13-15-20z"/>
  </g>

  <text x="120" y="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#ffffff">Craft Poker</text>
  <text x="122" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="600" fill="#cdeee0">Home poker with friends — dozens of games</text>
  <text x="122" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="500" fill="#8fd3b6">Fun Money, not gambling</text>

  <rect x="120" y="512" width="330" height="4" rx="2" fill="#d98a3c"/>
  <text x="120" y="560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#eafff5" opacity="0.85">friends.craftpoker.com</text>
</svg>
