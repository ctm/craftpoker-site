<!--
  PLACEHOLDER hero graphic (1200x675, ~16:9).
  A tasteful "cards on felt" illustration sized so a real hero image of the
  same dimensions can drop in without changing the layout.
  TODO(ctm): replace with final hero artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Illustration of playing cards and chips on a green felt table">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7a58"/>
      <stop offset="1" stop-color="#0f4a35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#3fa87d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3fa87d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#06251a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="24" fill="url(#felt)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- chip stack -->
  <g transform="translate(250 470)" filter="url(#soft)">
    <ellipse cx="0" cy="52" rx="78" ry="26" fill="#0c3a2a"/>
    <g>
      <ellipse cx="0" cy="40" rx="78" ry="26" fill="#e7ece9"/>
      <ellipse cx="0" cy="26" rx="78" ry="26" fill="#d98a3c"/>
      <ellipse cx="0" cy="12" rx="78" ry="26" fill="#e7ece9"/>
      <ellipse cx="0" cy="-2" rx="78" ry="26" fill="#1a6b4f"/>
      <ellipse cx="0" cy="-2" rx="78" ry="26" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 12" opacity="0.8"/>
      <ellipse cx="0" cy="-2" rx="40" ry="13" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
    </g>
  </g>

  <!-- fanned cards -->
  <g transform="translate(680 320)" filter="url(#soft)">
    <!-- back card -->
    <g transform="rotate(-16)">
      <rect x="-115" y="-165" width="230" height="330" rx="20" fill="#f6f8f7"/>
      <text x="-88" y="-120" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#c23b3b">K</text>
      <path transform="translate(70 130) scale(2.6)" fill="#c23b3b" d="M0 6c-3 -4 -8 -5 -8 -9a4 4 0 0 1 8 -1a4 4 0 0 1 8 1c0 4 -5 5 -8 9z"/>
    </g>
    <!-- middle card -->
    <g transform="rotate(0) translate(0 -6)">
      <rect x="-115" y="-165" width="230" height="330" rx="20" fill="#ffffff"/>
      <text x="-92" y="-120" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#16211d">A</text>
      <path transform="translate(0 6) scale(3.2)" fill="#16211d" d="M0 -14c-6 7 -15 12 -15 20 0 4.5 3.6 7.6 8 7.6 2.3 0 4.2-.9 5.5-2.5-.4 3.6-1.6 5.9-4 7.9h11c-2.4-2-3.6-4.3-4-7.9 1.3 1.6 3.2 2.5 5.5 2.5 4.4 0 8-3.1 8-7.6 0-8-9-13-15-20z"/>
    </g>
    <!-- front card -->
    <g transform="rotate(16)">
      <rect x="-115" y="-165" width="230" height="330" rx="20" fill="#f6f8f7"/>
      <text x="-92" y="-120" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#c23b3b">Q</text>
      <path transform="translate(-70 130) scale(2.6) rotate(180)" fill="#c23b3b" d="M0 6c-3 -4 -8 -5 -8 -9a4 4 0 0 1 8 -1a4 4 0 0 1 8 1c0 4 -5 5 -8 9z"/>
    </g>
  </g>

  <!-- unobtrusive placeholder label -->
  <text x="1176" y="655" text-anchor="end" font-family="system-ui, sans-serif" font-size="18" fill="#eafff5" opacity="0.35">placeholder art</text>
</svg>
