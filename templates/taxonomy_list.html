{% extends "base.html" %}

{% block title %}{{ taxonomy.name | capitalize }} &middot; {{ config.title }}{% endblock title %}

{% block content %}
<article>
  <h1>{{ taxonomy.name | capitalize }}</h1>
  <ul>
    {% for term in terms %}
    <li>
      <a href="{{ term.permalink }}">{{ term.name }}</a>
      ({{ term.pages | length }})
    </li>
    {% endfor %}
  </ul>
</article>
{% endblock content %}
