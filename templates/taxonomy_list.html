{% extends "base.html" %}

{% block content %}
<div class="wrap page">
  <header class="page-header">
    <h1 class="page-title">{{ taxonomy.name | capitalize }}</h1>
    <p class="meta">Browse posts by audience.</p>
  </header>

  <ul class="tags">
    {% for term in terms %}
    <li>
      <a class="pill" href="{{ term.permalink }}">
        {{ term.name }} <span class="pill--count">({{ term.pages | length }})</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock content %}
