<!DOCTYPE html>
<html lang="{{ lang | default(value="en") }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    {% if config.description %}
    <meta name="description" content="{{ config.description }}" />
    {% endif %}
    <!-- Site-wide Atom feed. -->
    <link
      rel="alternate"
      type="application/atom+xml"
      title="{{ config.title }} feed"
      href="{{ get_url(path='atom.xml') }}"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="{{ get_url(path='/') }}">Home</a>
        <a href="{{ get_url(path='/mission/') }}">Mission</a>
        <a href="{{ get_url(path='/blog/') }}">Blog</a>
        <a href="{{ get_url(path='/contact/') }}">Contact</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock content %}
    </main>
    <footer>
      <p>&copy; {{ now() | date(format="%Y") }} {{ config.title }}. The live game runs at
        <a href="https://friends.craftpoker.com">friends.craftpoker.com</a>.</p>
    </footer>
  </body>
</html>
